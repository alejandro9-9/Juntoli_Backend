[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "juntoli-backend"
version = "0.1.0"
description = "Backend services for Juntoli"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.16,<3",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.54,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
